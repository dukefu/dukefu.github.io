<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidy Lab</title>
<meta name="description" content="Tidy Lab removes and adds watermarks, stitches long screenshots and blurs what you don't want to share, on your iPhone and iPad.">
<style>
  :root { color-scheme: light dark; --fg: #1C1E23; --muted: #5b5f68; --bg: #ffffff; --accent: #FF6B4A; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f2f2f4; --muted: #a7abb4; --bg: #121316; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Tidy Lab</h1>
  <p>Remove and add watermarks, stitch long screenshots, and blur what you don't want to share, on your iPhone and iPad.</p>
  <p class="muted">Your photos never leave your device.</p>
  <p><a href="https://dukefu.com/privacy-policy">Privacy policy</a> · <a href="mailto:support@dukefu.com">support@dukefu.com</a></p>
</main>
</body>
</html>
